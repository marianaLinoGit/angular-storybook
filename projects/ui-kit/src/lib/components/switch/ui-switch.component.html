<label [class]="classes()">
  @if (!showSideLabels() && label()) {
    <span class="ui-switch__label">
      {{ label() }}
    </span>
  }

  @if (
    showSideLabels() &&
    (!showOnlyCurrentSide() || !checked()) &&
    (uncheckedLabel() || uncheckedIcon())
  ) {
    <span
      class="ui-switch__side-label"
      [class.ui-switch__side-label--active]="!checked()"
      [attr.aria-hidden]="isIconOnly() ? 'true' : null"
    >
      @if (uncheckedIcon()) {
        <ui-icon
          class="ui-switch__side-icon"
          [name]="uncheckedIcon()!"
          size="xs"
        />
      }

      @if (uncheckedLabel()) {
        <span class="ui-switch__side-text">
          {{ uncheckedLabel() }}
        </span>
      }
    </span>
  }

  <span class="ui-switch__control">
    <input
      [id]="id()"
      [name]="name()"
      type="checkbox"
      role="switch"
      [checked]="checked()"
      [disabled]="isDisabled()"
      [attr.aria-label]="switchAriaLabel()"
      [attr.aria-checked]="checked() ? 'true' : 'false'"
      [attr.aria-disabled]="isDisabled() ? 'true' : null"
      (change)="toggle()"
      (blur)="handleBlur()"
    />

    <span class="ui-switch__track">
      <span class="ui-switch__thumb"></span>
    </span>
  </span>

  @if (
    showSideLabels() &&
    (!showOnlyCurrentSide() || checked()) &&
    (checkedLabel() || checkedIcon())
  ) {
    <span
      class="ui-switch__side-label"
      [class.ui-switch__side-label--active]="checked()"
      [attr.aria-hidden]="isIconOnly() ? 'true' : null"
    >
      @if (checkedIcon()) {
        <ui-icon
          class="ui-switch__side-icon"
          [name]="checkedIcon()!"
          size="xs"
        />
      }

      @if (checkedLabel()) {
        <span class="ui-switch__side-text">
          {{ checkedLabel() }}
        </span>
      }
    </span>
  }

  @if (shouldShowStatus()) {
    <span class="ui-switch__status">
      {{ statusLabel() }}
    </span>
  }
</label>
