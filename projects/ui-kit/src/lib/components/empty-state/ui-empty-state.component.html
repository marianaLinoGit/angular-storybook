<section
  [class]="classes()"
  [attr.aria-labelledby]="titleId"
  [attr.aria-describedby]="descriptionId"
>
  @if (iconSvg()) {
    <div
      class="ui-empty-state__icon"
      aria-hidden="true"
      [innerHTML]="safeIconSvg()"
    ></div>
  } @else if (icon()) {
    <div class="ui-empty-state__icon" aria-hidden="true">
      {{ icon() }}
    </div>
  }

  <h2 [id]="titleId">
    {{ title() }}
  </h2>

  <p [id]="descriptionId">
    {{ description() }}
  </p>

  @if (buttonLabel()) {
    <button
      type="button"
      [class]="buttonClasses()"
      [disabled]="buttonDisabled()"
      [attr.aria-label]="buttonAriaLabel() || buttonLabel()"
      [attr.aria-disabled]="buttonDisabled() ? 'true' : null"
      (click)="handleButtonClick()"
    >
      {{ buttonLabel() }}
    </button>
  }
</section>
