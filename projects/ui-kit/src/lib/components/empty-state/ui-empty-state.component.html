<section
  [class]="classes()"
  [attr.aria-labelledby]="titleId"
  [attr.aria-describedby]="descriptionId"
>
  @if (iconName()) {
    <div class="ui-empty-state__icon" aria-hidden="true">
      <ui-icon [name]="iconName()!" size="4xl"></ui-icon>
    </div>
  }

  <h2 [id]="titleId">
    {{ title() }}
  </h2>

  <p [id]="descriptionId">
    {{ description() }}
  </p>

  @if (buttonLabel()) {
    <ui-button
      type="button"
      size="md"
      [color]="buttonColor()"
      [outline]="buttonOutline()"
      [label]="buttonLabel()!"
      [ariaLabel]="buttonAriaLabel() || buttonLabel()!"
      [disabled]="buttonDisabled()"
      [position]="buttonPosition()"
      (buttonClick)="buttonClick.emit()"
    />
  }
</section>
