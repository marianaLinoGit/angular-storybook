@if (label()) {
  <label [class]="classes()" [attr.for]="forId()" [id]="labelId()">
    <span>{{ label() }}</span>

    @if (required()) {
      <strong aria-hidden="true">*</strong>
    } @else if (showOptionalText()) {
      <small>{{ optionalText() }}</small>
    }

    @if (labelTooltip()) {
      <ui-tooltip
        class="ui-label__tooltip"
        [id]="resolvedLabelTooltipId()"
        [text]="labelTooltip()"
        [iconLabel]="labelTooltip()"
        icon="info"
        iconSize="sm"
        position="top"
        (click)="stopTooltipActivate($event)"
        (mousedown)="stopTooltipActivate($event)"
      />
    }
  </label>
}
