<div class="ui-select">
  @if (label()) {
    <ui-label
      [label]="label()"
      [forId]="id()"
      [labelId]="labelId()"
      [required]="hasRequired()"
      [optionalText]="optionalText()"
      [showOptionalText]="showOptionalText()"
    ></ui-label>
  }

  <div [class]="classes()">
    <div class="ui-select__control">
      <button
        type="button"
        role="combobox"
        class="ui-select__trigger"
        [id]="id()"
        [name]="name()"
        [disabled]="isDisabled()"
        [attr.aria-label]="selectAriaLabel()"
        [attr.aria-labelledby]="label() ? labelId() : null"
        [attr.aria-required]="hasRequired() ? 'true' : null"
        [attr.aria-invalid]="hasError() ? 'true' : null"
        [attr.aria-describedby]="hasError() ? errorId() : null"
        [attr.aria-expanded]="opened()"
        [attr.aria-controls]="listboxId()"
        aria-haspopup="listbox"
        (click)="toggle()"
        (blur)="handleBlur()"
      >
        <span class="ui-select__value">
          @if (selectedOption()?.iconName) {
            <ui-icon
              class="ui-select__icon"
              [name]="selectedOption()!.iconName!"
              [label]="selectedOption()?.iconLabel ?? null"
              size="sm"
            />
          }

          <span class="ui-select__value-text">
            {{ selectedLabel() || placeholder() }}
          </span>
        </span>

        <ui-icon class="ui-select__chevron" [name]="chevronIcon()" size="sm" />
      </button>

      @if (allowClear() && value()) {
        <button
          type="button"
          class="ui-select__clear"
          [attr.aria-label]="clearAriaLabel()"
          [disabled]="isDisabled()"
          (click)="clearValue($event)"
        >
          <ui-icon name="close" size="xs" />
        </button>
      }
    </div>

    @if (opened()) {
      <div
        class="ui-select__dropdown"
        [id]="listboxId()"
        role="listbox"
        [attr.aria-labelledby]="label() ? labelId() : selectAriaLabel()"
      >
        @if (searchable()) {
          <div class="ui-select__search">
            <input
              #searchInput
              type="search"
              [attr.aria-label]="searchAriaLabel()"
              [placeholder]="searchPlaceholder()"
              [value]="searchTerm()"
              (input)="handleSearch($event)"
            />
          </div>
        }

        <div class="ui-select__options">
          @if (visibleOptions().length === 0) {
            <div class="ui-select__empty">
              {{ emptyText() }}
            </div>
          } @else {
            @for (option of visibleOptions(); track option.value) {
              <button
                type="button"
                class="ui-select__option"
                [class.ui-select__option--selected]="option.value === value()"
                [disabled]="option.disabled"
                role="option"
                [attr.aria-selected]="option.value === value()"
                [attr.aria-disabled]="option.disabled ? 'true' : null"
                (click)="selectOption(option)"
              >
                @if (option.iconName) {
                  <ui-icon
                    class="ui-select__icon"
                    [name]="option.iconName"
                    [label]="option.iconLabel ?? null"
                    size="sm"
                  />
                }

                <span class="ui-select__option-text">
                  {{ option.label }}
                </span>
              </button>
            }
          }
        </div>
      </div>
    }
  </div>

  @if (hasError()) {
    <p class="ui-select-field__error" [id]="errorId()">
      {{ errorMessage() }}
    </p>
  }
</div>
