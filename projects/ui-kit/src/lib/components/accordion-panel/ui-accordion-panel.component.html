<article [class]="panelClasses()">
  <h3 class="ui-accordion-panel__heading">
    <button
      type="button"
      [id]="triggerId()"
      [disabled]="disabled()"
      [attr.aria-expanded]="open()"
      [attr.aria-controls]="panelId()"
      (click)="toggle()"
    >
      <span class="ui-accordion-panel__title">
        @if (icon(); as iconName) {
          <ui-icon
            class="ui-accordion-panel__icon"
            [name]="iconName"
            size="sm"
            aria-hidden="true"
          />
        }

        <span>{{ title() }}</span>

        @if (badge() !== null && badge() !== undefined) {
          <ui-badge [label]="badge()!" [type]="badgeType()" />
        }
      </span>

      <ui-icon
        class="ui-accordion-panel__toggle"
        [name]="open() ? 'chevron-up' : 'chevron-down'"
        size="sm"
        aria-hidden="true"
      />
    </button>
  </h3>

  @if (open()) {
    <div
      class="ui-accordion-panel__content"
      role="region"
      [id]="panelId()"
      [attr.aria-labelledby]="triggerId()"
    >
      <ng-content />
    </div>
  }
</article>
