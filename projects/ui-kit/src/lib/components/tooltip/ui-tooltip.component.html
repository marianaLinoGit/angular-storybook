<span class="ui-tooltip" [class.ui-tooltip--icon]="!!icon()">
  @if (icon(); as iconName) {
    <span
      class="ui-tooltip__trigger ui-tooltip__trigger--icon"
      tabindex="0"
      [attr.aria-describedby]="tooltipId"
    >
      <ui-icon
        [name]="iconName"
        [size]="iconSize()"
        [color]="iconColor()"
        [label]="resolvedIconLabel()"
      />
    </span>
  } @else {
    <ng-content />
  }

  @if (!disabled()) {
    <span
      role="tooltip"
      [id]="tooltipId"
      [class]="tooltipClasses()"
      [style.max-width]="maxWidth()"
      [style.transition-delay]="delay()"
    >
      @if (html()) {
        <span [innerHTML]="html()"></span>
      } @else {
        {{ text() }}
      }
    </span>
  }
</span>
