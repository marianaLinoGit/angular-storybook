@if (isVisible()) {
  <div [class]="backdropClasses()" (click)="handleBackdropClick($event)">
    <section
      [class]="modalClasses()"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="titleId"
      [attr.aria-describedby]="description() ? descriptionId : null"
      (click)="$event.stopPropagation()"
    >
      <header class="ui-modal__header">
        <div class="ui-modal__title-wrapper">
          @if (icon(); as iconName) {
            <ui-icon
              class="ui-modal__title-icon"
              [name]="iconName"
              size="md"
              aria-hidden="true"
            />
          }

          <h2 [id]="titleId">{{ title() }}</h2>
        </div>

        @if (showCloseButton()) {
          <ui-button
            class="ui-modal__close"
            type="button"
            color="secondary"
            size="sm"
            icon="close"
            [outline]="true"
            [iconOnly]="true"
            [ariaLabel]="closeAriaLabel()"
            (buttonClick)="close()"
          />
        }
      </header>

      <main class="ui-modal__body">
        @if (description()) {
          <p [id]="descriptionId">{{ description() }}</p>
        }

        <ng-content></ng-content>
      </main>

      @if (type() !== "content") {
        <footer class="ui-modal__footer">
          @if (type() === "confirmation") {
            <ui-button
              type="button"
              color="secondary"
              size="md"
              [outline]="true"
              [label]="cancelLabel()"
              (buttonClick)="cancel()"
            />
          }

          <ui-button
            type="button"
            color="primary"
            size="md"
            [label]="type() === 'confirmation' ? confirmLabel() : closeLabel()"
            (buttonClick)="type() === 'confirmation' ? confirm() : close()"
          />
        </footer>
      }
    </section>
  </div>
}
