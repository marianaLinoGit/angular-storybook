@if (isVisible()) {
  <div [class]="backdropClasses()" (click)="handleBackdropClick($event)">
    <section
      [class]="modalClasses()"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="titleId"
      [attr.aria-describedby]="description() ? descriptionId : null"
      (click)="$event.stopPropagation()"
    >
      <header class="ui-modal__header">
        <div class="ui-modal__title-wrapper">
          @if (icon()) {
            <span class="ui-modal__title-icon" aria-hidden="true">
              {{ icon() }}
            </span>
          }

          <h2 [id]="titleId">{{ title() }}</h2>
        </div>

        @if (showCloseButton()) {
          <button
            type="button"
            class="ui-modal__icon-button"
            [attr.aria-label]="closeAriaLabel()"
            (click)="close()"
          >
            ×
          </button>
        }
      </header>

      <main class="ui-modal__body">
        @if (description()) {
          <p [id]="descriptionId">{{ description() }}</p>
        }

        <ng-content></ng-content>
      </main>

      @if (type() !== "content") {
        <footer class="ui-modal__footer">
          @if (type() === "confirmation") {
            <button
              type="button"
              class="ui-modal__button ui-modal__button--secondary"
              (click)="cancel()"
            >
              {{ cancelLabel() }}
            </button>
          }

          <button
            type="button"
            class="ui-modal__button ui-modal__button--primary"
            (click)="type() === 'confirmation' ? confirm() : close()"
          >
            {{ type() === "confirmation" ? confirmLabel() : closeLabel() }}
          </button>
        </footer>
      }
    </section>
  </div>
}
