<div [class]="classes()">
  @if (label()) {
    <ui-label
      [label]="label()"
      [forId]="controlId()"
      [labelId]="labelIdAttr()"
      [required]="hasRequired()"
      [optionalText]="optionalText()"
      [showOptionalText]="showOptionalText()"
      [labelTooltip]="labelTooltip()"
      [labelTooltipId]="labelTooltipId()"
    />
  }

  <div class="ui-form-field__control">
    <ng-content />
  </div>

  <div class="ui-form-field__addon">
    <ng-content select="[uiFormFieldAddon]" />
  </div>

  @if (hint()) {
    <p class="ui-form-field__hint" [id]="hintId()">{{ hint() }}</p>
  }

  @if (hasErrorState() && errorMessage()) {
    <ui-field-error
      [id]="errorId()"
      [message]="errorMessage()!"
      [flush]="true"
    />
  }
</div>
