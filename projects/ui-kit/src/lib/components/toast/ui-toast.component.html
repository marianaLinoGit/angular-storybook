@if (visible()) {
  <div
    [class]="classes()"
    [attr.role]="role()"
    [attr.aria-live]="ariaLive()"
    [attr.aria-labelledby]="titleId"
    [attr.aria-describedby]="text() ? textId : null"
  >
    @if (showIcon()) {
      <ui-icon
        class="ui-toast__icon"
        [name]="resolvedIcon()"
        size="sm"
        aria-hidden="true"
      />
    }

    <div class="ui-toast__content">
      <strong [id]="titleId">{{ title() }}</strong>

      @if (text()) {
        <p [id]="textId">{{ text() }}</p>
      }
    </div>

    @if (closable()) {
      <ui-button
        class="ui-toast__close"
        type="button"
        [color]="color()"
        size="sm"
        icon="close"
        [outline]="true"
        [iconOnly]="true"
        [ariaLabel]="closeAriaLabel()"
        (buttonClick)="close()"
      />
    }
  </div>
}
