@if (visible()) {
  <div
    [class]="classes()"
    [attr.role]="role()"
    [attr.aria-live]="ariaLive()"
    [attr.aria-labelledby]="titleId"
    [attr.aria-describedby]="textId"
  >
    @if (showIcon()) {
      <ui-icon
        class="ui-toast__icon"
        [name]="resolvedIcon()"
        size="sm"
        aria-hidden="true"
      />
    }

    <div class="ui-toast__content">
      <strong [id]="titleId">{{ title() }}</strong>

      <p [id]="textId">{{ text() }}</p>
    </div>

    @if (closable()) {
      <button
        type="button"
        class="ui-toast__close"
        [attr.aria-label]="closeAriaLabel()"
        (click)="close()"
      >
        <ui-icon name="close" size="sm" aria-hidden="true" />
      </button>
    }
  </div>
}
