<div [class]="tabsClasses()">
  <div class="ui-tabs__header" role="tablist" [attr.aria-label]="ariaLabel()">
    @for (tab of tabItems(); track tab.id()) {
      <button
        type="button"
        role="tab"
        [id]="getTabId(tab)"
        [attr.aria-selected]="isActive(tab) ? 'true' : 'false'"
        [attr.aria-controls]="getPanelId(tab)"
        [attr.tabindex]="isActive(tab) ? 0 : -1"
        [disabled]="tab.disabled()"
        [class.ui-tabs__tab--active]="isActive(tab)"
        class="ui-tabs__tab"
        (click)="selectTab(tab)"
      >
        @if (tab.icon()) {
          <ui-icon
            class="ui-tabs__icon"
            [name]="tab.icon()!"
            size="sm"
            aria-hidden="true"
          />
        }

        <span class="ui-tabs__label">{{ tab.label() }}</span>

        @if (tab.count() !== undefined) {
          <small aria-hidden="true">
            {{ tab.count() }}
          </small>
        }
      </button>
    }
  </div>

  @if (activeTab(); as tab) {
    <div
      class="ui-tabs__content"
      role="tabpanel"
      [id]="getPanelId(tab)"
      [attr.aria-labelledby]="getTabId(tab)"
      tabindex="0"
    >
      <ng-container [ngTemplateOutlet]="tab.panelTemplate()" />
    </div>
  }
</div>
