<div class="ui-tabs">
  <div class="ui-tabs__header" role="tablist" [attr.aria-label]="ariaLabel()">
    @for (tab of tabs(); track tab.id) {
      <button
        type="button"
        role="tab"
        [id]="getTabId(tab)"
        [attr.aria-selected]="isActive(tab) ? 'true' : 'false'"
        [attr.aria-controls]="getPanelId(tab)"
        [attr.tabindex]="isActive(tab) ? 0 : -1"
        [disabled]="tab.disabled"
        [class.ui-tabs__tab--active]="isActive(tab)"
        [class.ui-tabs__tab--checked]="tab.checked"
        class="ui-tabs__tab"
        (click)="selectTab(tab)"
      >
        @if (tab.checked) {
          <ui-icon
            class="ui-tabs__check"
            name="check"
            size="xs"
            aria-hidden="true"
          />
        }

        <span>{{ tab.label }}</span>

        @if (tab.count !== undefined) {
          <small aria-hidden="true">
            {{ tab.count }}
          </small>
        }
      </button>
    }
  </div>

  @if (activeTab(); as tab) {
    <div
      class="ui-tabs__content"
      role="tabpanel"
      [id]="getPanelId(tab)"
      [attr.aria-labelledby]="getTabId(tab)"
      tabindex="0"
    >
      <p>{{ tab.content }}</p>
    </div>
  }
</div>
