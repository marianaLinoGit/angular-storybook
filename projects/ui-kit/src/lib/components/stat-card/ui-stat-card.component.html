<article [class]="cardClasses()" [attr.aria-label]="computedAriaLabel()">
  @if (icon()) {
    <ui-icon class="ui-stat-card__icon" [name]="icon()!" [size]="iconSize()" />
  }

  <div class="ui-stat-card__content">
    <strong>{{ value() }}</strong>
    <span>{{ label() }}</span>
  </div>
</article>
