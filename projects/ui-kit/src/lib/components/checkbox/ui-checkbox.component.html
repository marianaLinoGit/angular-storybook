<div class="ui-checkbox-field">
  <div [class]="classes()">
    <input
      [id]="id()"
      [name]="name()"
      type="checkbox"
      [checked]="checked()"
      [required]="hasRequired()"
      [disabled]="isDisabled()"
      [attr.aria-label]="ariaLabel()"
      [attr.aria-labelledby]="label() ? labelId() : null"
      [attr.aria-required]="hasRequired() ? 'true' : null"
      [attr.aria-invalid]="hasError() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      (change)="handleChange($event)"
      (blur)="handleBlur()"
    />

    <label class="ui-checkbox__box" [attr.for]="id()" aria-hidden="true">
      @if (checked()) {
        <ui-icon name="check" size="xs" />
      }
    </label>

    <div class="ui-checkbox__text">
      @if (label()) {
        <ui-label
          [label]="label()"
          [forId]="id()"
          [labelId]="labelId()"
          [labelTooltip]="labelTooltip()"
          [labelTooltipId]="labelTooltipId()"
          [required]="hasRequired()"
          customClass="ui-checkbox__label"
        />
      }

      @if (linkLabel() && linkUrl()) {
        <a
          [href]="linkUrl()"
          [target]="linkTarget()"
          [attr.rel]="linkRel()"
          (click)="handleLinkClick($event)"
          (mousedown)="handleLinkClick($event)"
        >
          {{ linkLabel() }}
        </a>
      }
    </div>
  </div>

  @if (hasError() && !hideError()) {
    <ui-field-error [id]="errorId()" [message]="errorMessage()" />
  }
</div>
