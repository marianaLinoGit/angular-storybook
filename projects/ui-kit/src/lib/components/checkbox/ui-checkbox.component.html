<div class="ui-checkbox-field">
  <label [class]="classes()">
    <input
      [id]="id()"
      [name]="name()"
      type="checkbox"
      [checked]="checked()"
      [required]="hasRequired()"
      [disabled]="isDisabled()"
      [attr.aria-label]="ariaLabel()"
      [attr.aria-required]="hasRequired() ? 'true' : null"
      [attr.aria-invalid]="hasError() ? 'true' : null"
      [attr.aria-describedby]="hasError() ? errorId() : null"
      (change)="handleChange($event)"
      (blur)="handleBlur()"
    />

    <span class="ui-checkbox__box" aria-hidden="true">
      @if (checked()) {
        <span>✓</span>
      }
    </span>

    <span class="ui-checkbox__text">
      {{ label() }}

      @if (linkLabel() && linkUrl()) {
        <a
          [href]="linkUrl()"
          [target]="linkTarget()"
          [attr.rel]="linkRel()"
          (click)="handleLinkClick($event)"
          (mousedown)="handleLinkClick($event)"
        >
          {{ linkLabel() }}
        </a>
      }
    </span>
  </label>

  @if (hasError()) {
    <p class="ui-checkbox-field__error" [id]="errorId()">
      {{ errorMessage() }}
    </p>
  }
</div>
