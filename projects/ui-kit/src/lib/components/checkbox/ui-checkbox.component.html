<div class="ui-checkbox-field">
  <label [class]="classes()">
    <input
      [id]="id()"
      [name]="name()"
      type="checkbox"
      [checked]="checked()"
      [required]="hasRequired()"
      [disabled]="isDisabled()"
      [attr.aria-label]="ariaLabel()"
      [attr.aria-required]="hasRequired() ? 'true' : null"
      [attr.aria-invalid]="hasError() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      (change)="handleChange($event)"
      (blur)="handleBlur()"
    />

    <span class="ui-checkbox__box" aria-hidden="true">
      @if (checked()) {
        <ui-icon name="check" size="xs" />
      }
    </span>

    <span class="ui-checkbox__text">
      <span class="ui-checkbox__label-row">
        <span>{{ label() }}</span>

        @if (labelTooltip()) {
          <ui-tooltip
            class="ui-checkbox__tooltip"
            [id]="labelTooltipId()"
            [text]="labelTooltip()"
            [iconLabel]="labelTooltip()"
            icon="info"
            iconSize="sm"
            position="top"
            (click)="handleLinkClick($event)"
            (mousedown)="handleLinkClick($event)"
          />
        }
      </span>

      @if (linkLabel() && linkUrl()) {
        <a
          [href]="linkUrl()"
          [target]="linkTarget()"
          [attr.rel]="linkRel()"
          (click)="handleLinkClick($event)"
          (mousedown)="handleLinkClick($event)"
        >
          {{ linkLabel() }}
        </a>
      }
    </span>
  </label>

  @if (hasError() && !hideError()) {
    <ui-field-error [id]="errorId()" [message]="errorMessage()" />
  }
</div>
