@if (isVisible()) {
  <section [class]="alertClasses()" role="alert" aria-live="polite">
    @if (showIcon()) {
      <ui-icon
        class="ui-alert__icon"
        [name]="defaultIcon()"
        size="sm"
        aria-hidden="true"
      />
    }

    <div class="ui-alert__content">
      @if (title()) {
        <strong class="ui-alert__title">
          {{ title() }}
        </strong>
      }

      <p class="ui-alert__message">
        {{ message() }}
      </p>
    </div>

    @if (closable()) {
      <ui-button
        class="ui-alert__close"
        type="button"
        color="secondary"
        size="sm"
        icon="close"
        [outline]="true"
        [iconOnly]="true"
        [ariaLabel]="closeAriaLabel()"
        (buttonClick)="close()"
      />
    }
  </section>
}
