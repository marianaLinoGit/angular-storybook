<div [class]="wrapperClasses()">
  <button
    [type]="type()"
    [class]="buttonClasses()"
    [disabled]="disabled() || loading()"
    [attr.aria-label]="computedAriaLabel()"
    [attr.aria-disabled]="disabled() || loading()"
    [attr.aria-busy]="loading() ? 'true' : null"
    (click)="onClick()"
  >
    @if (loading()) {
      <span class="ui-button__loading" aria-hidden="true"></span>
    }

    @if (!loading() && icon() && iconPosition() === "left") {
      <span class="ui-button__icon" aria-hidden="true">
        @if (iconMode() === "image") {
          <img [src]="icon()!" alt="" />
        } @else if (iconMode() === "mask") {
          <span
            class="ui-button__mask-icon"
            [style.--ui-button-icon-url]="'url(' + icon() + ')'"
          ></span>
        } @else {
          {{ icon() }}
        }
      </span>
    }

    @if (!iconOnly()) {
      <span
        class="ui-button__label"
        [class.ui-button__label--hide-mobile]="hideLabelOnMobile()"
      >
        {{ loading() ? loadingLabel() : label() }}
      </span>
    }

    @if (!loading() && icon() && iconPosition() === "right") {
      <span class="ui-button__icon" aria-hidden="true">
        @if (iconMode() === "image") {
          <img [src]="icon()!" alt="" />
        } @else if (iconMode() === "mask") {
          <span
            class="ui-button__mask-icon"
            [style.--ui-button-icon-url]="'url(' + icon() + ')'"
          ></span>
        } @else {
          {{ icon() }}
        }
      </span>
    }
  </button>
</div>
