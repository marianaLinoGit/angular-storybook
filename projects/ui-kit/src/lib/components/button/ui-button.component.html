<div [class]="wrapperClasses()">
  <button
    [type]="type()"
    [class]="buttonClasses()"
    [disabled]="disabled() || loading()"
    [attr.aria-label]="computedAriaLabel()"
    [attr.aria-disabled]="disabled() || loading()"
    [attr.aria-busy]="loading() ? 'true' : null"
    (click)="onClick()"
  >
    @if (loading()) {
      <span class="ui-button__loading" aria-hidden="true"></span>
    }

    @if (!loading() && buttonIcon() && iconPosition() === "left") {
      <ui-icon class="ui-button__icon" [name]="buttonIcon()!" size="sm" />
    }

    @if (!iconOnly()) {
      <span
        class="ui-button__label"
        [class.ui-button__label--hide-mobile]="hideLabelOnMobile()"
      >
        {{ loading() ? loadingLabel() : label() }}
      </span>
    }

    @if (!loading() && buttonIcon() && iconPosition() === "right") {
      <ui-icon class="ui-button__icon" [name]="buttonIcon()!" size="sm" />
    }
  </button>
</div>
