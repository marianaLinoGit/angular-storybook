<nav class="ui-breadcrumb" [attr.aria-label]="ariaLabel()">
  <ol>
    @for (item of items(); track $index; let last = $last; let index = $index) {
      <li>
        @if (!last && !item.disabled) {
          <button
            type="button"
            [attr.aria-label]="item.label"
            (click)="itemClick.emit(item)"
          >
            <span class="ui-breadcrumb__content">
              @if (getIcon(item, index); as iconName) {
                <ui-icon
                  class="ui-breadcrumb__icon"
                  [name]="iconName"
                  size="sm"
                  aria-hidden="true"
                />
              }

              @if (shouldShowLabel(index)) {
                <span>{{ item.label }}</span>
              }
            </span>
          </button>
        } @else {
          <span
            class="ui-breadcrumb__current"
            [class.ui-breadcrumb__current--disabled]="item.disabled"
            [attr.aria-current]="last ? 'page' : null"
          >
            <span class="ui-breadcrumb__content">
              @if (getIcon(item, index); as iconName) {
                <ui-icon
                  class="ui-breadcrumb__icon"
                  [name]="iconName"
                  size="sm"
                  aria-hidden="true"
                />
              }

              @if (shouldShowLabel(index)) {
                <span>{{ item.label }}</span>
              }
            </span>
          </span>
        }

        @if (!last) {
          <small class="ui-breadcrumb__separator" aria-hidden="true">
            {{ separator() }}
          </small>
        }
      </li>
    }
  </ol>
</nav>
