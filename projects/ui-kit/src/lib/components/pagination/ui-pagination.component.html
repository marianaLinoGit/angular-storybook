<div class="ui-pagination">
  @if (showControls()) {
    <nav class="ui-pagination__nav" [attr.aria-label]="ariaLabel()">
      @if (showFirstLast()) {
        <div class="ui-pagination__nav-btn ui-pagination__nav-btn--first">
          <ui-button
            [label]="firstLabel()"
            [ariaLabel]="firstLabel()"
            color="primary"
            [size]="size()"
            [outline]="true"
            type="button"
            [disabled]="isFirstPage() || isControlsDisabled()"
            (buttonClick)="goToFirst()"
          />
        </div>
      }

      <div class="ui-pagination__nav-btn ui-pagination__nav-btn--previous">
        <ui-button
          [label]="previousLabel()"
          [ariaLabel]="previousLabel()"
          color="primary"
          [size]="size()"
          [outline]="true"
          type="button"
          [disabled]="isFirstPage() || isControlsDisabled()"
          (buttonClick)="goToPrevious()"
        />
      </div>

      <p
        class="ui-pagination__status"
        [id]="statusId"
        aria-live="polite"
        aria-atomic="true"
      >
        <span class="ui-pagination__status-text">
          {{ pageLabel() }}
          <strong aria-current="page">{{ pageIndex() }}</strong>
          {{ ofLabel() }}
          <strong>{{ totalPages() }}</strong>
        </span>
      </p>

      <div class="ui-pagination__nav-btn ui-pagination__nav-btn--next">
        <ui-button
          [label]="nextLabel()"
          [ariaLabel]="nextLabel()"
          color="primary"
          [size]="size()"
          [outline]="true"
          type="button"
          [disabled]="isLastPage() || isControlsDisabled()"
          (buttonClick)="goToNext()"
        />
      </div>

      @if (showFirstLast()) {
        <div class="ui-pagination__nav-btn ui-pagination__nav-btn--last">
          <ui-button
            [label]="lastLabel()"
            [ariaLabel]="lastLabel()"
            color="primary"
            [size]="size()"
            [outline]="true"
            type="button"
            [disabled]="isLastPage() || isControlsDisabled()"
            (buttonClick)="goToLast()"
          />
        </div>
      }
    </nav>
  }

  @if (showPageSize()) {
    <div class="ui-pagination__page-size">
      <ui-select
        [label]="pageSizeSelectLabel() ?? ''"
        [size]="selectSize()"
        [options]="pageSizeSelectOptions()"
        [showOptionalText]="false"
        [required]="false"
        [value]="pageSize()"
        [ariaLabel]="pageSizeSelectAriaLabel()"
        (valueChange)="onPageSizeChange($event)"
      />
    </div>
  }
</div>
