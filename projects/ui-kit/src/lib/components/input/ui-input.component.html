<div class="ui-input-field">
  @if (label()) {
    <ui-label
      [label]="label()"
      [forId]="id()"
      [required]="hasRequired()"
      [optionalText]="optionalText()"
      [showOptionalText]="showOptionalText()"
    ></ui-label>
  }

  <input
    [id]="id()"
    [name]="name()"
    [type]="type()"
    [class]="classes()"
    [value]="value()"
    [placeholder]="placeholder()"
    [autocomplete]="autocomplete()"
    [attr.inputmode]="inputMode()"
    [required]="hasRequired()"
    [readonly]="readonly()"
    [disabled]="isDisabled()"
    [attr.aria-label]="inputAriaLabel()"
    [attr.aria-required]="hasRequired() ? 'true' : null"
    [attr.aria-invalid]="hasError() ? 'true' : null"
    [attr.aria-describedby]="hasError() ? errorId() : null"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
  />

  @if (hasError()) {
    <p class="ui-input-field__error" [id]="errorId()">
      {{ errorMessage() }}
    </p>
  }
</div>
